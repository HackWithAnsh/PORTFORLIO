<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="A microcontroller board sending a location signal to a phone">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f3b562" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f3b562" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="640" fill="#131822"/>
  <rect width="960" height="640" fill="url(#grid)"/>
  <circle cx="720" cy="330" r="290" fill="url(#glow)"/>

  <!-- board -->
  <g>
    <rect x="90" y="230" width="300" height="180" rx="16" fill="#1c2331" stroke="#3a4560" stroke-width="2"/>
    <!-- pins -->
    <g fill="#3a4560">
      <rect x="120" y="218" width="8" height="12" rx="2"/><rect x="150" y="218" width="8" height="12" rx="2"/><rect x="180" y="218" width="8" height="12" rx="2"/>
      <rect x="210" y="218" width="8" height="12" rx="2"/><rect x="240" y="218" width="8" height="12" rx="2"/><rect x="270" y="218" width="8" height="12" rx="2"/>
      <rect x="120" y="410" width="8" height="12" rx="2"/><rect x="150" y="410" width="8" height="12" rx="2"/><rect x="180" y="410" width="8" height="12" rx="2"/>
      <rect x="210" y="410" width="8" height="12" rx="2"/><rect x="240" y="410" width="8" height="12" rx="2"/><rect x="270" y="410" width="8" height="12" rx="2"/>
    </g>
    <!-- chip -->
    <rect x="150" y="272" width="96" height="96" rx="10" fill="#232c3e" stroke="#3a4560" stroke-width="2"/>
    <g stroke="#3a4560" stroke-width="2" stroke-linecap="round">
      <path d="M172 296h52M172 320h36M172 344h52"/>
    </g>
    <!-- antenna trace -->
    <path d="M280 300h30v-30h30v60h-30" fill="none" stroke="#f3b562" stroke-opacity=".7" stroke-width="3" stroke-linejoin="round"/>
    <!-- status LED -->
    <circle cx="352" cy="384" r="7" fill="#f3b562"/>
    <!-- button -->
    <circle cx="112" cy="252" r="9" fill="none" stroke="#3a4560" stroke-width="2"/>
  </g>

  <!-- signal arcs -->
  <g fill="none" stroke="#f3b562" stroke-linecap="round" stroke-width="3">
    <path d="M410 296a44 44 0 0 1 0 48" stroke-opacity=".9"/>
    <path d="M428 278a72 72 0 0 1 0 84" stroke-opacity=".62"/>
    <path d="M446 260a100 100 0 0 1 0 120" stroke-opacity=".34"/>
  </g>
  <path d="M470 320H600" fill="none" stroke="#f3b562" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- phone -->
  <rect x="610" y="120" width="190" height="380" rx="30" fill="#1c2331" stroke="#3a4560" stroke-width="2"/>
  <rect x="626" y="148" width="158" height="326" rx="16" fill="#131822"/>
  <rect x="678" y="130" width="54" height="8" rx="4" fill="#2f3a52"/>

  <!-- map -->
  <g stroke="#2f3a52" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M626 230c40 10 60-24 100-10s44 30 58 24"/>
    <path d="M626 330c50-18 74 14 110 0s34-26 48-20"/>
    <path d="M626 410c30-6 50 20 88 6s52-12 70-6"/>
    <path d="M676 148v326M736 148v326"/>
  </g>

  <!-- location ripple + pin -->
  <circle cx="705" cy="320" r="62" fill="none" stroke="#f3b562" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="705" cy="320" r="38" fill="none" stroke="#f3b562" stroke-opacity=".32" stroke-width="2"/>
  <path d="M705 356s-24-24-24-44a24 24 0 0 1 48 0c0 20-24 44-24 44Z" fill="#f3b562"/>
  <circle cx="705" cy="312" r="9" fill="#131822"/>

  <!-- alert bar -->
  <rect x="642" y="428" width="126" height="26" rx="13" fill="#f3b562" fill-opacity=".14" stroke="#f3b562" stroke-opacity=".5"/>
  <rect x="660" y="438" width="60" height="6" rx="3" fill="#f3b562" fill-opacity=".8"/>
</svg>
